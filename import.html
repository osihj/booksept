<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>日記批次匯入工具</title>
<style>
  body { font-family: "Noto Sans TC", sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; color: #2c2a27; }
  h1 { font-size: 22px; }
  .card { border: 1px solid rgba(0,0,0,.1); border-radius: 12px; padding: 20px; margin-top: 16px; }
  button { background: #b8621d; color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #log { white-space: pre-wrap; font-size: 13px; background: #f7f5f2; border-radius: 8px; padding: 12px; margin-top: 14px; max-height: 360px; overflow: auto; }
  input[type=file] { margin: 10px 0; }
  .login-error { color: #96352b; }
</style>
</head>
<body>

  <div id="login-screen">
    <h1>日記批次匯入工具</h1>
    <p>請先用你的帳號登入，才能寫入你的日記資料庫。</p>
    <button id="google-login-btn" type="button">使用 Google 登入</button>
    <p id="login-error" class="login-error" hidden></p>
  </div>

  <div id="app" hidden>
    <h1>日記批次匯入工具</h1>
    <div class="card">
      <p>1. 選擇用 <code>notion_to_diary.py</code> 轉好的 <code>diary_import.json</code></p>
      <input type="file" id="file-input" accept="application/json">
      <p id="file-summary"></p>
      <p>2. 確認筆數沒問題後，按下方按鈕開始匯入（會直接寫進你目前登入帳號的日記資料庫）：</p>
      <button id="import-btn" disabled>開始匯入</button>
      <div id="log"></div>
    </div>
  </div>

  <script type="module">
    import { db, $, wireLoginScreen, watchAuth } from "./shared.js?v=20260906f";
    import { collection, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    wireLoginScreen();
    let entries = [];
    let currentUser = null;

    watchAuth((user) => { currentUser = user; }, () => { currentUser = null; });

    function log(msg) {
      const el = $("log");
      el.textContent += msg + "\n";
      el.scrollTop = el.scrollHeight;
    }

    $("file-input").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        entries = JSON.parse(text);
        if (!Array.isArray(entries)) throw new Error("檔案格式不對，應該是一個陣列");
        $("file-summary").textContent = `讀取到 ${entries.length} 篇日記，準備匯入。`;
        $("import-btn").disabled = entries.length === 0;
      } catch (err) {
        $("file-summary").textContent = "讀取失敗：" + err.message;
        $("import-btn").disabled = true;
      }
    });

    $("import-btn").addEventListener("click", async () => {
      if (!currentUser) { alert("尚未登入"); return; }
      $("import-btn").disabled = true;
      $("log").textContent = "";
      let ok = 0, fail = 0;
      for (const e of entries) {
        try {
          if (!e.date) { log(`⚠️ 略過「${e.title || "未命名"}」：沒有有效日期，請手動新增`); fail++; continue; }
          const ref = doc(collection(db, "diaryEntries"));
          await setDoc(ref, {
            uid: currentUser.uid,
            title: e.title || "未命名日記",
            date: e.date,
            category: e.category || "未分類",
            tags: Array.isArray(e.tags) ? e.tags : [],
            content: e.content || "",
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp()
          });
          ok++;
          log(`✅ ${e.date} 《${e.title}》`);
        } catch (err) {
          fail++;
          log(`❌ 《${e.title}》失敗：${err.message}`);
        }
      }
      log(`\n匯入完成：成功 ${ok} 篇，失敗/略過 ${fail} 篇。`);
      $("import-btn").disabled = false;
    });
  </script>
</body>
</html>
