<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#b8621d">
<title>藏書閣</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  :root {
    --bg: #f8f7f4;
    --surface: #ffffff;
    --surface2: #f2f0eb;
    --border: #e6e3dc;
    --text: #2c2a27;
    --text2: #5c5852;
    --text3: #9c968f;
    --accent: #2c5234;
    --accent-light: #f0f4f1;
    --accent2: #b8621d;
    --accent2-light: #faf2eb;
    --red: #96352b;
    --red-light: #f9ebea;
    --radius: 6px;
    --shadow: 0 4px 20px rgba(44,42,39,0.04), 0 1px 3px rgba(44,42,39,0.02);
    --shadow-sm: 0 2px 8px rgba(44,42,39,0.03);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: 'Noto Serif TC', serif; font-weight: 600; margin: 0; }

  /* ---------- Login ---------- */
  .login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #f8f7f4;
  }

  .login-card {
    width: 100%;
    max-width: 456px;
    background: #fff;
    border-radius: 16px;
    padding: 54px 38px 52px;
    box-shadow:
      0 8px 30px rgba(0, 0, 0, 0.06),
      0 2px 8px rgba(0, 0, 0, 0.03);
    text-align: center;
  }

  .login-card h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 700;
    color: #292929;
  }

  .login-sub {
    margin: 12px 0 32px;
    color: #aaa;
    font-size: 16px;
  }

  .login-google-btn {
    width: 100%;
    height: 66px;
    border: none;
    border-radius: 12px;
    background: #2c5a38;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: inherit;
    font-size: 19px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .login-google-btn:hover {
    background: #234a2d;
  }

  .login-google-btn:disabled,
  .login-email-btn:disabled {
    opacity: 0.65;
    cursor: wait;
  }

  .login-google-btn i {
    font-size: 22px;
  }

  .login-divider {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 30px 0;
    color: #b8b8b8;
    font-size: 16px;
  }

  .login-divider::before,
  .login-divider::after {
    content: "";
    height: 1px;
    background: #ddd;
    flex: 1;
  }

  .login-divider span {
    flex: 0 0 auto;
  }

  .login-input {
    box-sizing: border-box;
    width: 100%;
    height: 62px;
    padding: 0 18px;
    margin-bottom: 14px;
    border: 2px solid #e1e1e1;
    border-radius: 12px;
    background: #fff;
    color: #333;
    font-family: inherit;
    font-size: 18px;
    outline: none;
    transition: border-color 0.2s ease;
  }

  .login-input:focus {
    border-color: #aaa;
  }

  .login-input::placeholder {
    color: #888;
  }

  .login-email-btn {
    width: 100%;
    height: 63px;
    border: none;
    border-radius: 12px;
    background: #2878e5;
    color: #fff;
    font-family: inherit;
    font-size: 19px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .login-email-btn:hover {
    background: #1768d5;
  }

  .forgot-password-btn {
    margin-top: 22px;
    border: none;
    background: transparent;
    color: #aaa;
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
  }

  .forgot-password-btn:hover {
    color: #777;
    text-decoration: underline;
  }

  .login-error {
    margin: 16px 0 0;
    color: #96352b;
    font-size: 14px;
    line-height: 1.5;
  }

  @media (max-width: 640px) {
    .login-screen {
      padding: 16px;
    }

    .login-card {
      max-width: 100%;
      padding: 42px 24px;
    }

    .login-card h1 {
      font-size: 24px;
    }

    .login-google-btn,
    .login-email-btn {
      height: 58px;
      font-size: 17px;
    }

    .login-input {
      height: 56px;
      font-size: 16px;
    }
  }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px 20px; border-radius: var(--radius);
    font-size: 14px; font-weight: 500;
    border: 1px solid var(--border); cursor: pointer;
    background: var(--surface); color: var(--text);
    transition: all 0.2s ease; white-space: nowrap;
  }
  .btn:hover { background: var(--surface2); }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); width: 100%; }
  .btn-primary:hover { background: #203d27; }
  .btn-accent { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-accent:hover { background: #203d27; }
  .btn-accent-outline { background: var(--surface); color: var(--accent); border-color: var(--accent); }
  .btn-accent-outline:hover { background: var(--accent-light); }
  .btn-danger { background: var(--surface); color: var(--red); border-color: var(--border); }
  .btn-danger:hover { background: var(--red-light); border-color: var(--red); }
  .btn-ghost { background: transparent; border-color: var(--border); color: var(--text2); }
  .btn-ghost:hover { background: var(--surface2); }
  .btn-sm { padding: 6px 14px; font-size: 13px; }
  .icon-btn {
    background: transparent; border: none; color: var(--text2); cursor: pointer;
    padding: 6px; border-radius: 8px; font-size: 18px; display: flex;
  }
  .icon-btn:hover { background: var(--surface2); }

  /* ---------- App shell ---------- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--accent-light); color: var(--accent);
    font-family: 'Noto Serif TC', serif; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  .brand-name { font-size: 18px; }
  .page-title { font-size: 18px; }

  .main { max-width: 760px; margin: 0 auto; padding: 20px 20px 175px; }
  .page { display: none; }
  .page.active { display: block; }

  /* ---------- Cards / stats ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .card-title {
    font-size: 14px; font-weight: 700;
    letter-spacing: 0.04em;
    margin-bottom: 16px;
    display: flex; align-items: center;
  }
  .card-title::before {
    content: ''; display: inline-block; width: 3px; height: 14px;
    background: var(--accent); margin-right: 8px; border-radius: 2px;
  }

  .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-sm);
  }
  .stat-num { font-size: 24px; font-weight: 700; font-family: 'Roboto', sans-serif; color: var(--accent); }
  .stat-label { font-size: 12px; font-weight: 500; color: var(--text2); margin-top: 6px; }

  .tag-stat-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .tag-stat-row:last-child { border-bottom: none; }
  .tag-stat-count { font-family: 'Roboto', sans-serif; font-weight: 500; color: var(--text2); }

  /* ---------- Toolbar / filters ---------- */
  .toolbar { display: flex; gap: 10px; margin-bottom: 14px; }
  .search-box {
    flex: 1; display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 0 14px; height: 42px;
  }
  .search-box i { color: var(--text3); }
  .search-box input { border: none; background: none; outline: none; flex: 1; color: var(--text); font-size: 14px; }
  .sort-select {
    border: 1px solid var(--border); background: var(--surface);
    border-radius: var(--radius); padding: 0 12px; height: 42px; color: var(--text); font-size: 13px;
  }

  .filter-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; scrollbar-width: none; }
  .filter-tabs::-webkit-scrollbar { display: none; }
  .filter-tab {
    padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text2); font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .filter-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ---------- Book grid ---------- */
  .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; margin-top: 4px; }
  .book-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px; cursor: pointer; box-shadow: var(--shadow-sm);
    display: flex; flex-direction: column;
  }
  .book-cover {
    width: 100%; aspect-ratio: 3/4; border-radius: 4px;
    background: var(--accent-light); margin-bottom: 10px; overflow: hidden;
    display: flex; align-items: center; justify-content: center; color: var(--accent);
  }
  .book-cover img { width: 100%; height: 100%; object-fit: cover; }
  .book-cover i { font-size: 26px; opacity: 0.5; }
  .book-title { font-weight: 500; font-size: 13px; margin: 0 0 3px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .book-author { font-size: 12px; color: var(--text2); margin: 0 0 8px; }
  .book-meta { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
  .status-badge { font-size: 10px; font-weight: 500; padding: 2px 8px; border-radius: 10px; background: var(--accent-light); color: var(--accent); border: 1px solid rgba(44,82,52,0.15); white-space: nowrap; }
  .status-badge.unread { background: var(--surface2); color: var(--text3); border-color: var(--border); }
  .book-rating { display: flex; gap: 1px; color: var(--accent2); font-size: 11px; }
  .book-rating i.empty { color: var(--border); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text2); }
  .empty-state i { font-size: 40px; color: var(--text3); margin-bottom: 10px; }
  .empty-state h3 { margin-bottom: 6px; font-size: 16px; }
  .empty-state p { margin: 0 0 20px; font-size: 14px; }


  /* ---------- Shelf overview / category bar ---------- */
  .shelf-overview { margin-bottom: 18px; }
  .shelf-welcome {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 2px 16px;
  }
  .shelf-eyebrow { font-size: 10px; letter-spacing: .16em; color: var(--text3); font-weight: 700; }
  .shelf-welcome h2 { font-size: 22px; margin: 2px 0 3px; }
  .shelf-welcome p { margin: 0; color: var(--text2); font-size: 13px; }
  .shelf-welcome p strong { color: var(--accent); font-size: 16px; }
  .shelf-mini-stats {
    display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 16px;
  }
  .mini-stat {
    border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius);
    padding: 10px 6px; cursor: pointer; color: var(--text); box-shadow: var(--shadow-sm);
  }
  .mini-stat:hover { background: var(--surface2); }
  .mini-stat span { display:block; font:700 19px Roboto,sans-serif; color:var(--accent); }
  .mini-stat small { display:block; margin-top:2px; color:var(--text2); font-size:11px; }
  .recent-reading {
    background: var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding: 14px; box-shadow: var(--shadow-sm);
  }
  .section-heading { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; font-size:13px; font-weight:700; }
  .text-btn { border:0; background:none; color:var(--accent); font-size:12px; cursor:pointer; padding:3px; }
  .recent-book-row { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .recent-book { min-width:0; cursor:pointer; }
  .recent-book-cover { aspect-ratio:3/4; border-radius:4px; overflow:hidden; background:var(--accent-light); display:flex; align-items:center; justify-content:center; color:var(--accent); }
  .recent-book-cover img { width:100%; height:100%; object-fit:cover; }
  .recent-book-title { font-size:11px; margin-top:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .recent-book-status { font-size:10px; color:var(--text3); }
  .category-label { display:inline-flex; align-items:center; margin-top:3px; padding:2px 7px; border-radius:10px; background:var(--accent2-light); color:var(--accent2); font-size:10px; }
  .category-tabs-wrap { position:relative; margin-bottom:10px; }
  .category-tabs-label { font-size:11px; color:var(--text3); margin:0 0 5px 2px; }
  #category-filters { margin-bottom:0; padding-bottom:2px; }
  .category-tab { border-radius:8px; }
  .category-stat-row { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .category-stat-row:last-child { border-bottom:none; }
  .category-stat-bar { flex:1; height:6px; background:var(--surface2); border-radius:10px; overflow:hidden; }
  .category-stat-bar > span { display:block; height:100%; background:var(--accent); border-radius:10px; }
  .category-stat-count { min-width:78px; text-align:right; font:500 12px Roboto,sans-serif; color:var(--text2); white-space:nowrap; }
  .source-help { font-size:12px; color:var(--text3); margin-top:6px; }
  @media (max-width:640px) {
    .shelf-welcome { align-items:flex-start; }
    .recent-book-row { grid-template-columns:repeat(4,1fr); gap:7px; }
    .shelf-mini-stats { gap:6px; }
  }

  /* ---------- Profile page ---------- */
  .profile-header { display: flex; flex-direction: column; align-items: center; padding: 24px 0 8px; }
  .profile-avatar { width: 72px; height: 72px; border-radius: 50%; border: 1px solid var(--border); object-fit: cover; margin-bottom: 12px; }
  .profile-email { font-size: 14px; color: var(--text2); margin-bottom: 24px; }

  /* ---------- FAB ---------- */
  .fab {
    position: fixed; right: 20px; bottom: 144px; z-index: 90;
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--accent2); color: #fff; border: none;
    box-shadow: 0 6px 16px rgba(184,98,29,0.35);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; cursor: pointer;
  }
  .fab:active { transform: scale(0.95); }

  /* ---------- Bottom bars (category dock + bottom nav) ---------- */
  .bottom-bars {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    display: flex; flex-direction: column;
  }
  .category-dock {
    background: var(--surface);
    border-top: 1px solid var(--border);
  }
  .category-dock.hidden { display: none; }
  .category-dock-inner {
    display: flex; align-items: center; gap: 8px;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    padding: 10px 14px; max-width: 760px; margin: 0 auto;
    scrollbar-width: none;
  }
  .category-dock-inner::-webkit-scrollbar { display: none; }
  .category-dock-inner .filter-tab { flex-shrink: 0; }

  nav.bottom-nav {
    background: var(--surface);
    border-top: 1px solid var(--border);
  }
  .nav-inner { display: flex; align-items: center; justify-content: space-around; padding: 8px 0 max(8px, env(safe-area-inset-bottom)); max-width: 760px; margin: 0 auto; }
  .nav-btn {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 6px 0; font-size: 11px; font-weight: 500; color: var(--text2);
    border: none; background: none; cursor: pointer; flex: 1;
  }
  .nav-btn i { font-size: 19px; color: var(--text2); }
  .nav-btn.active, .nav-btn.active i { color: var(--accent); font-weight: 600; }

  /* ---------- Modal ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(44,42,39,0.4);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 40px 16px; overflow-y: auto; z-index: 200;
  }
  .modal { background: var(--surface); border-radius: 14px; width: 100%; max-width: 560px; box-shadow: var(--shadow); }
  .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--border); }
  .modal-body { padding: 20px 22px 24px; }

  .scan-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .scan-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: #fff; border-radius: var(--radius); padding: 9px 14px; font-size: 13px; cursor: pointer; border: 1px solid var(--accent); }
  .scan-btn-secondary { background: var(--surface); color: var(--accent); border-color: var(--accent); }
  .scan-status { font-size: 13px; color: var(--text2); margin: 0 0 14px; }

  .cover-field { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }
  .cover-preview { width: 68px; height: 92px; border-radius: 6px; background: var(--accent-light); color: var(--accent); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
  .cover-preview img { width: 100%; height: 100%; object-fit: cover; }
  .cover-actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }

  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .field { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--text2); }
  .field-wide { grid-column: 1 / -1; }
  .field input, .field select { border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; height: 38px; color: var(--text); background: var(--surface); font-family: inherit; }
  .field input[readonly] { background: var(--surface2); color: var(--text3); }

  .star-input { display: flex; gap: 4px; font-size: 20px; color: var(--border); height: 38px; align-items: center; }
  .star-input i { cursor: pointer; }
  .star-input i.filled { color: var(--accent2); }

  .field-label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 8px; }
  .notes-section { margin-bottom: 10px; }
  .notes-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .note-item { background: var(--surface2); border-radius: var(--radius); padding: 10px 12px; font-size: 13px; }
  .note-item .note-date { display: block; font-size: 11px; color: var(--text3); margin-bottom: 4px; }
  .note-add-row { display: flex; gap: 8px; align-items: flex-end; }
  .note-add-row textarea { flex: 1; border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; resize: vertical; color: var(--text); font-family: inherit; min-height: 60px; }

  .modal-footer { display: flex; align-items: center; gap: 10px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
  .footer-spacer { flex: 1; }

  @media (max-width: 640px) {
    .field-grid { grid-template-columns: 1fr; }
    .modal-overlay { padding: 0; }
    .modal { max-width: 100%; min-height: 100vh; border-radius: 0; }
  }
</style>
</head>
<body>

  <!-- 未登入畫面 -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">

      <h1>活動行事曆</h1>

      <p class="login-sub">請登入以繼續</p>

      <!-- Google 登入 -->
      <button id="google-login-btn" class="login-google-btn" type="button">
        <i class="ti ti-brand-google"></i>
        使用 Google 登入
      </button>

      <!-- 分隔線 -->
      <div class="login-divider">
        <span>或</span>
      </div>

      <!-- Email -->
      <input
        id="email-input"
        class="login-input"
        type="email"
        placeholder="Email"
        autocomplete="email"
      >

      <!-- 密碼 -->
      <input
        id="password-input"
        class="login-input"
        type="password"
        placeholder="密碼"
        autocomplete="current-password"
      >

      <!-- Email 登入 -->
      <button id="email-login-btn" class="login-email-btn" type="button">
        Email 登入
      </button>

      <!-- 忘記密碼 -->
      <button id="forgot-password-btn" class="forgot-password-btn" type="button">
        忘記密碼？寄送重設信
      </button>

      <p id="login-error" class="login-error" hidden></p>

    </div>
  </div>

  <!-- 主畫面 -->
  <div id="app" hidden>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">冊</span>
        <span class="brand-name page-title" id="page-title">書架</span>
      </div>
    </header>

    <main class="main">

      <!-- 書架 -->
      <section id="page-shelf" class="page active">
        <div class="shelf-overview">

  <!-- 新增／編輯書籍面板 -->
  <div id="book-modal" class="modal-overlay" hidden>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithEmailAndPassword,
      sendPasswordResetEmail,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import {
      getFirestore, collection, doc, setDoc, deleteDoc, query, where, onSnapshot, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    // ============================================================
    // 填入你自己 Firebase 專案的設定值（Firebase Console → 專案設定 → 一般 → 你的應用程式）
    // 這組 config 是公開的用戶端識別資訊，不是密碼，可以放心留在 GitHub 上；
    // 真正的存取控制是靠 firestore.rules 限制只有你能讀寫。
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyDkG-iHRYVLDtX6_H5EFJt4wlB2JH51xA8",
      authDomain: "booksept.firebaseapp.com",
      projectId: "booksept",
      storageBucket: "booksept.firebasestorage.app",
      messagingSenderId: "496792717845",
      appId: "1:496792717845:web:2ddf2af5d69e61b8a7dc1c"
    };
    // 只允許這個 email 登入使用；留空字串代表不限制
    const ALLOWED_EMAIL = "hsinglinstar@gmail.com";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // ---------- DOM refs ----------
    const $ = (id) => document.getElementById(id);
    const loginScreen = $("login-screen");
    const appRoot = $("app");
    const loginBtn = $("google-login-btn");
    const emailInput = $("email-input");
    const passwordInput = $("password-input");
    const emailLoginBtn = $("email-login-btn");
    const forgotPasswordBtn = $("forgot-password-btn");
    const loginError = $("login-error");
    const logoutBtn = $("logout-btn");
    const profileAvatar = $("profile-avatar");
    const profileEmail = $("profile-email");
    const pageTitle = $("page-title");

    const bookGrid = $("book-grid");
    const emptyState = $("empty-state");
    const searchInput = $("search-input");
    const sortSelect = $("sort-select");
    const statusFilters = $("status-filters");
    const categoryFiltersEl = $("category-filters");
    const categoryDockEl = $("category-dock");
    const categoryDockFiltersEl = $("category-dock-filters");
    const tagFiltersEl = $("tag-filters");
    const tagStatsList = $("tag-stats-list");
    const categoryStatsList = $("category-stats-list");
    const categoryOptions = $("category-options");

    const modal = $("book-modal");
    const modalTitle = $("modal-title");
    const bookForm = $("book-form");
    const closeModalBtn = $("close-modal-btn");
    const cancelBtn = $("cancel-btn");
    const deleteBookBtn = $("delete-book-btn");

    const isbnLookupBtn = $("isbn-lookup-btn");
    const nclSearchBtn = $("ncl-search-btn");
    const scanStatus = $("scan-status");

    const coverPreview = $("cover-preview");
    const coverUploadInput = $("cover-upload-input");
    const removeCoverBtn = $("remove-cover-btn");
    const starInput = $("star-input");
    const notesList = $("notes-list");
    const noteInput = $("note-input");
    const addNoteBtn = $("add-note-btn");

    // ---------- State ----------
    let currentUser = null;
    let allBooks = [];
    let unsubscribeBooks = null;
    let activeStatus = "all";
    let activeCategory = "all";
    let activeTag = null;
    let editingId = null;
    let currentCoverUrl = "";
    let pendingCoverFile = null;
    let currentRating = 0;
    let currentNotes = [];

    // ================= Bottom nav / pages =================
    const pageLabels = { shelf: "書架", stats: "統計", profile: "我的" };
    document.querySelectorAll(".nav-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const target = btn.dataset.page;
        document.querySelectorAll(".nav-btn").forEach((b) => b.classList.toggle("active", b === btn));
        document.querySelectorAll(".page").forEach((p) => p.classList.toggle("active", p.id === "page-" + target));
        pageTitle.textContent = pageLabels[target];
        categoryDockEl.classList.toggle("hidden", target !== "shelf");
        window.scrollTo(0, 0);
      });
    });

    $("overview-add-btn").addEventListener("click", () => openAddModal());
    $("show-all-books-btn").addEventListener("click", () => {
      activeStatus = "all";
      activeCategory = "all";
      activeTag = null;
      [...statusFilters.children].forEach((c) => c.classList.toggle("active", c.dataset.status === "all"));
      renderCategoryFilters();
      renderTagFilters();
      render();
      window.scrollTo({top: 0, behavior: "smooth"});
    });
    document.querySelectorAll("[data-status-jump]").forEach((btn) => {
      btn.addEventListener("click", () => {
        activeStatus = btn.dataset.statusJump;
        [...statusFilters.children].forEach((c) => c.classList.toggle("active", c.dataset.status === activeStatus));
        render();
        window.scrollTo({top: 0, behavior: "smooth"});
      });
    });
    document.querySelectorAll("[data-page-jump]").forEach((btn) => {
      btn.addEventListener("click", () => document.querySelector('.nav-btn[data-page="' + btn.dataset.pageJump + '"]').click());
    });

    // ================= Auth =================
    loginBtn.addEventListener("click", async () => {
      loginError.hidden = true;
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        console.error(err);
        // 直接顯示錯誤代碼，方便判斷原因（最常見：auth/unauthorized-domain，
        // 代表 Firebase Console → Authentication → Settings → Authorized domains
        // 還沒加入這個網站的網域，導致 Google 登入視窗根本開不起來）
        loginError.textContent = "登入失敗：" + (err.code || err.message || err);
        loginError.hidden = false;
      }
    });

    // Email / 密碼登入
    emailLoginBtn.addEventListener("click", async () => {
      loginError.hidden = true;
      loginError.style.color = "#96352b";

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        loginError.textContent = "請輸入 Email 和密碼。";
        loginError.hidden = false;
        return;
      }

      emailLoginBtn.disabled = true;
      emailLoginBtn.textContent = "登入中...";

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        console.error(err);

        switch (err.code) {
          case "auth/invalid-credential":
          case "auth/wrong-password":
          case "auth/user-not-found":
            loginError.textContent = "Email 或密碼錯誤，請確認後再試。";
            break;
          case "auth/invalid-email":
            loginError.textContent = "Email 格式不正確。";
            break;
          case "auth/too-many-requests":
            loginError.textContent = "登入嘗試次數過多，請稍後再試。";
            break;
          default:
            loginError.textContent = "登入失敗：" + (err.message || err);
        }

        loginError.hidden = false;
      } finally {
        emailLoginBtn.disabled = false;
        emailLoginBtn.textContent = "Email 登入";
      }
    });

    // Enter 鍵登入
    [emailInput, passwordInput].forEach((input) => {
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          emailLoginBtn.click();
        }
      });
    });

    // 忘記密碼
    forgotPasswordBtn.addEventListener("click", async () => {
      loginError.hidden = true;
      loginError.style.color = "#96352b";

      const email = emailInput.value.trim();

      if (!email) {
        loginError.textContent = "請先輸入 Email，再按「忘記密碼」。";
        loginError.hidden = false;
        return;
      }

      try {
        await sendPasswordResetEmail(auth, email);
        loginError.textContent = "重設密碼信已寄出，請查看你的 Email。";
        loginError.style.color = "#2c5a38";
        loginError.hidden = false;
      } catch (err) {
        console.error(err);

        if (err.code === "auth/invalid-email") {
          loginError.textContent = "Email 格式不正確。";
        } else {
          loginError.textContent = "無法寄送重設信：" + (err.message || err);
        }

        loginError.hidden = false;
      }
    });

    logoutBtn.addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
      if (user && ALLOWED_EMAIL && user.email !== ALLOWED_EMAIL) {
        loginError.textContent = "這個 Google 帳號沒有使用權限。";
        loginError.hidden = false;
        signOut(auth);
        return;
      }
      currentUser = user;
      if (user) {
        loginScreen.hidden = true;
        appRoot.hidden = false;
        profileAvatar.src = user.photoURL || "";
        profileEmail.textContent = user.email || "";
        subscribeBooks(user.uid);
      } else {
        loginScreen.hidden = false;
        appRoot.hidden = true;
        if (unsubscribeBooks) unsubscribeBooks();
        allBooks = [];
      }
    });

    // ================= Firestore subscription =================
    function subscribeBooks(uid) {
      const q = query(collection(db, "books"), where("uid", "==", uid));
      unsubscribeBooks = onSnapshot(q, (snap) => {
        allBooks = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        renderCategoryFilters();
        renderTagFilters();
        render();
      }, (err) => console.error(err));
    }

    // ================= Render: shelf =================
    function render() {
      let books = [...allBooks];
      if (activeStatus !== "all") books = books.filter((b) => b.status === activeStatus);
      if (activeCategory !== "all") books = books.filter((b) => (b.category || "未分類") === activeCategory);
      if (activeTag) books = books.filter((b) => (b.tags || []).includes(activeTag));
      const term = searchInput.value.trim().toLowerCase();
      if (term) {
        books = books.filter((b) => {
          const hay = [b.title, b.author, b.translator, ...(b.tags || [])].join(" ").toLowerCase();
          return hay.includes(term);
        });
      }

      const [sortField, sortDir] = sortSelect.value.split("-");
      books.sort((a, b) => {
        let av = a[sortField], bv = b[sortField];
        if (sortField === "createdAt") { av = a.createdAt?.seconds || 0; bv = b.createdAt?.seconds || 0; }
        if (typeof av === "string") av = av.toLowerCase();
        if (typeof bv === "string") bv = bv.toLowerCase();
        if (av === undefined || av === null || av === "") av = sortDir === "desc" ? -Infinity : Infinity;
        if (bv === undefined || bv === null || bv === "") bv = sortDir === "desc" ? -Infinity : Infinity;
        if (av < bv) return sortDir === "asc" ? -1 : 1;
        if (av > bv) return sortDir === "asc" ? 1 : -1;
        return 0;
      });

      bookGrid.innerHTML = "";
      emptyState.hidden = books.length > 0 || allBooks.length === 0;
      if (allBooks.length > 0 && books.length === 0) {
        emptyState.hidden = false;
        emptyState.innerHTML = `<i class="ti ti-filter-off"></i><h3>沒有符合條件的書</h3><p>請調整搜尋、閱讀狀態或分類篩選。</p>`;
      } else if (allBooks.length === 0) {
        emptyState.innerHTML = `<i class="ti ti-books"></i><h3>書單還是空的</h3><p>掃描一本書的條碼，或手動輸入資料，開始建立你的書單。</p><button class="btn btn-accent" id="empty-add-btn"><i class="ti ti-plus"></i>新增第一本書</button>`;
        $("empty-add-btn").onclick = () => openAddModal();
      }
      books.forEach((b) => bookGrid.appendChild(renderCard(b)));
      renderStats();
      renderShelfOverview();
    }

    function renderCard(b) {
      const card = document.createElement("div");
      card.className = "book-card";
      card.addEventListener("click", () => openEditModal(b));
      const statusLabel = { unread: "未讀", reading: "閱讀中", finished: "已讀完" }[b.status] || "未讀";
      const rating = b.rating || 0;
      let stars = "";
      for (let i = 1; i <= 5; i++) stars += `<i class="ti ti-star${i <= rating ? "" : " empty"}"></i>`;
      card.innerHTML = `
        <div class="book-cover">${b.coverUrl ? `<img src="${escapeHtml(b.coverUrl)}" alt="">` : `<i class="ti ti-photo"></i>`}</div>
        <p class="book-title">${escapeHtml(b.title || "未命名")}</p>
        <p class="book-author">${escapeHtml(b.author || "")}</p>
        ${b.category ? `<span class="category-label">${escapeHtml(b.category)}</span>` : ""}
        <div class="book-meta">
          <span class="status-badge ${b.status === "unread" ? "unread" : ""}">${statusLabel}</span>
          <span class="book-rating">${stars}</span>
        </div>`;
      return card;
    }

    function renderStats() {
      $("stat-total").textContent = allBooks.length;
      const spent = allBooks.reduce((sum, b) => sum + (Number(b.price) || 0), 0);
      $("stat-spent").textContent = "$" + spent.toLocaleString();
      $("stat-finished").textContent = allBooks.filter((b) => b.status === "finished").length;
      const thisYear = String(new Date().getFullYear());
      $("stat-year").textContent = allBooks.filter((b) => (b.purchaseDate || "").startsWith(thisYear)).length;

      const categoryCounts = {};
      allBooks.forEach((b) => {
        const category = (b.category || "未分類").trim() || "未分類";
        categoryCounts[category] = (categoryCounts[category] || 0) + 1;
      });
      const categoryEntries = Object.entries(categoryCounts).sort((a, b) => b[1] - a[1]);
      const maxCategory = categoryEntries[0]?.[1] || 1;
      const totalForPercent = allBooks.length || 1;
      categoryStatsList.innerHTML = categoryEntries.length
        ? categoryEntries.map(([category, count]) => `
            <div class="category-stat-row">
              <span style="min-width:72px">${escapeHtml(category)}</span>
              <div class="category-stat-bar"><span style="width:${Math.round(count / maxCategory * 100)}%"></span></div>
              <span class="category-stat-count">${count} 本 · ${Math.round(count / totalForPercent * 100)}%</span>
            </div>`).join("")
        : `<p style="color:var(--text3);font-size:13px;margin:0;">還沒有分類資料</p>`;

      const tagCounts = {};
      allBooks.forEach((b) => (b.tags || []).forEach((t) => { tagCounts[t] = (tagCounts[t] || 0) + 1; }));
      const entries = Object.entries(tagCounts).sort((a, b) => b[1] - a[1]);
      tagStatsList.innerHTML = entries.length
        ? entries.map(([tag, count]) => `<div class="tag-stat-row"><span>${escapeHtml(tag)}</span><span class="tag-stat-count">${count} 本</span></div>`).join("")
        : `<p style="color:var(--text3);font-size:13px;margin:0;">還沒有標籤資料</p>`;
    }

    function renderShelfOverview() {
      $("shelf-total-inline").textContent = allBooks.length;
      $("mini-unread").textContent = allBooks.filter((b) => b.status === "unread").length;
      $("mini-reading").textContent = allBooks.filter((b) => b.status === "reading").length;
      $("mini-finished").textContent = allBooks.filter((b) => b.status === "finished").length;

      const categories = new Set(allBooks.map(b => (b.category || "未分類").trim() || "未分類"));
      $("mini-categories").textContent = allBooks.length ? categories.size : 0;

      const recent = [...allBooks].sort((a,b) => {
        const av = a.createdAt?.seconds || 0, bv = b.createdAt?.seconds || 0;
        return bv - av;
      }).slice(0, 4);
      const row = $("recent-book-row");
      row.innerHTML = recent.length ? recent.map(b => `
        <div class="recent-book" data-book-id="${escapeHtml(b.id)}">
          <div class="recent-book-cover">${b.coverUrl ? `<img src="${escapeHtml(b.coverUrl)}" alt="">` : `<i class="ti ti-book"></i>`}</div>
          <div class="recent-book-title">${escapeHtml(b.title || "未命名")}</div>
          <div class="recent-book-status">${escapeHtml({unread:"未讀",reading:"閱讀中",finished:"已讀完"}[b.status] || "未讀")}</div>
        </div>`).join("") :
        `<div style="grid-column:1/-1;color:var(--text3);font-size:12px;padding:8px 0;">新增書籍後，最近加入的書會顯示在這裡。</div>`;

      row.querySelectorAll(".recent-book").forEach(el => {
        el.addEventListener("click", () => {
          const book = allBooks.find(b => b.id === el.dataset.bookId);
          if (book) openEditModal(book);
        });
      });

      const categoriesSorted = [...categories].sort((a,b) => a.localeCompare(b, "zh-Hant"));
      categoryOptions.innerHTML = categoriesSorted.map(c => `<option value="${escapeHtml(c)}"></option>`).join("");
    }

    function renderCategoryFilters() {
      const categories = new Set();
      allBooks.forEach((b) => categories.add((b.category || "未分類").trim() || "未分類"));
      const list = ["all", ...[...categories].sort((a,b) => a.localeCompare(b, "zh-Hant"))];

      const buildChips = (container) => {
        container.innerHTML = "";
        list.forEach((category) => {
          const chip = document.createElement("button");
          chip.className = "filter-tab category-tab" + (activeCategory === category ? " active" : "");
          chip.textContent = category === "all" ? "全部分類" : category;
          chip.addEventListener("click", () => {
            activeCategory = category;
            renderCategoryFilters();
            render();
          });
          container.appendChild(chip);
        });
      };

      // 書架清單上方那一排，與底部固定的可滑動分類 Bar，內容與選取狀態互相同步
      buildChips(categoryFiltersEl);
      buildChips(categoryDockFiltersEl);
    }

    function renderTagFilters() {
      const tagSet = new Set();
      allBooks.forEach((b) => (b.tags || []).forEach((t) => tagSet.add(t)));
      tagFiltersEl.innerHTML = "";
      [...tagSet].sort().forEach((tag) => {
        const chip = document.createElement("button");
        chip.className = "filter-tab" + (activeTag === tag ? " active" : "");
        chip.textContent = tag;
        chip.addEventListener("click", () => {
          activeTag = activeTag === tag ? null : tag;
          renderTagFilters();
          render();
        });
        tagFiltersEl.appendChild(chip);
      });
    }

    statusFilters.addEventListener("click", (e) => {
      const btn = e.target.closest(".filter-tab");
      if (!btn) return;
      activeStatus = btn.dataset.status;
      [...statusFilters.children].forEach((c) => c.classList.toggle("active", c === btn));
      render();
    });
    searchInput.addEventListener("input", render);
    sortSelect.addEventListener("change", render);

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str || "";
      return div.innerHTML;
    }

    function compressImageToDataUrl(file, maxWidth = 320, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = (e) => {
          const img = new Image();
          img.onerror = reject;
          img.onload = () => {
            const scale = Math.min(1, maxWidth / img.width);
            const w = Math.round(img.width * scale);
            const h = Math.round(img.height * scale);
            const canvas = document.createElement("canvas");
            canvas.width = w; canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // ================= Modal open/close =================
    $("fab-add").addEventListener("click", () => openAddModal());
    document.addEventListener("click", (e) => {
      if (e.target.closest("#empty-add-btn")) openAddModal();
    });
    closeModalBtn.addEventListener("click", closeModal);
    cancelBtn.addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });

    function openAddModal() {
      editingId = null;
      modalTitle.textContent = "新增書籍";
      deleteBookBtn.hidden = true;
      bookForm.reset();
      currentCoverUrl = ""; pendingCoverFile = null; currentRating = 0; currentNotes = [];
      updateCoverPreview(); updateStarDisplay(); renderNotesList();
      scanStatus.hidden = true;
      modal.hidden = false;
    }

    function openEditModal(book) {
      editingId = book.id;
      modalTitle.textContent = "編輯書籍";
      deleteBookBtn.hidden = false;
      $("field-title").value = book.title || "";
      $("field-author").value = book.author || "";
      $("field-translator").value = book.translator || "";
      $("field-publisher").value = book.publisher || "";
      $("field-isbn").value = book.isbn || "";
      $("field-purchase-date").value = book.purchaseDate || "";
      $("field-price").value = book.price ?? "";
      $("field-condition").value = book.condition || "new";
      $("field-status").value = book.status || "unread";
      $("field-category").value = book.category || "";
      $("field-location").value = book.location || "";
      $("field-tags").value = (book.tags || []).join(", ");
      currentCoverUrl = book.coverUrl || ""; pendingCoverFile = null;
      currentRating = book.rating || 0; currentNotes = [...(book.notes || [])];
      updateCoverPreview(); updateStarDisplay(); renderNotesList();
      scanStatus.hidden = true;
      modal.hidden = false;
    }

    function closeModal() { modal.hidden = true; }

    // ================= Cover =================
    function updateCoverPreview() {
      coverPreview.innerHTML = currentCoverUrl ? `<img src="${currentCoverUrl}" alt="">` : `<i class="ti ti-photo"></i>`;
      removeCoverBtn.hidden = !currentCoverUrl;
    }
    coverUploadInput.addEventListener("change", () => {
      const file = coverUploadInput.files[0];
      if (!file) return;
      pendingCoverFile = file;
      currentCoverUrl = URL.createObjectURL(file);
      updateCoverPreview();
    });
    removeCoverBtn.addEventListener("click", () => {
      currentCoverUrl = ""; pendingCoverFile = null; updateCoverPreview();
    });

    // ================= Star rating =================
    starInput.addEventListener("click", (e) => {
      const star = e.target.closest("[data-star]");
      if (!star) return;
      currentRating = Number(star.dataset.star);
      updateStarDisplay();
    });
    function updateStarDisplay() {
      [...starInput.children].forEach((el) => el.classList.toggle("filled", Number(el.dataset.star) <= currentRating));
    }

    // ================= Notes =================
    addNoteBtn.addEventListener("click", () => {
      const text = noteInput.value.trim();
      if (!text) return;
      currentNotes.push({ date: new Date().toISOString(), text });
      noteInput.value = "";
      renderNotesList();
    });
    function renderNotesList() {
      notesList.innerHTML = "";
      currentNotes.slice().reverse().forEach((note) => {
        const idx = currentNotes.indexOf(note);
        const el = document.createElement("div");
        el.className = "note-item";
        const dateStr = new Date(note.date).toLocaleDateString("zh-TW");
        el.innerHTML = `<span class="note-date">${dateStr}</span>${escapeHtml(note.text)}`;
        const del = document.createElement("button");
        del.type = "button"; del.className = "icon-btn"; del.style.float = "right";
        del.innerHTML = `<i class="ti ti-x" style="font-size:14px"></i>`;
        del.addEventListener("click", () => { currentNotes.splice(idx, 1); renderNotesList(); });
        el.prepend(del);
        notesList.appendChild(el);
      });
    }

    // ================= ISBN 查詢 =================
    isbnLookupBtn.addEventListener("click", () => {
      const isbn = $("field-isbn").value.trim();
      if (isbn) lookupISBN(isbn);
      else showScanStatus("請先輸入 ISBN，再按「查詢書目」。");
    });

    // ================= 國家圖書館查詢 / 回填 =================
    // 國圖沒有提供給這個前端頁面直接使用的公開 JSON API；瀏覽器端直接 fetch
    // 會受到跨網域限制。因此提供「開啟國圖 → 一鍵帶回」流程。
    const NCL_ORIGIN = "https://isbn.ncl.edu.tw";
    // 國圖原本的 Pact=Search&Pval= 連結已失效；目前可正常使用的官方
    // 「書目資料查詢」簡易查詢頁是 Pact=DisplayAll4Simple（實際查詢是頁面內
    // 以 POST 送出，無法直接用網址帶入 ISBN 自動查詢），因此改為開啟該頁，
    // 再請使用者在頁面上貼上 ISBN 查詢。
    const NCL_SIMPLE_SEARCH_URL = "https://isbn.ncl.edu.tw/NEW_ISBNNet/H30_SearchBooks.php?Pact=DisplayAll4Simple";

    function normalizeISBNForNcl(isbn) {
      return String(isbn || "").replace(/\D/g, "");
    }

    function openNclSearch(isbn) {
      isbn = normalizeISBNForNcl(isbn);
      if (!isbn) {
        showScanStatus("請先輸入 ISBN，再開啟國家圖書館查詢。");
        return;
      }
      const win = window.open(NCL_SIMPLE_SEARCH_URL, "ncl-isbn-search");
      if (!win) {
        showScanStatus("瀏覽器阻擋了新分頁，請允許此網站開啟新視窗後再試。");
        return;
      }
      showScanStatus(`已開啟國家圖書館書目資料查詢頁面，請在該頁貼上 ISBN ${isbn} 查詢。查到書目後，可按「帶回我的書單」自動填入。`);
    }

    // NCL Userscript 會從國圖頁把資料 postMessage 回本頁。
    window.addEventListener("message", (event) => {
      if (event.origin !== NCL_ORIGIN) return;
      if (!event.data || event.data.type !== "NCL_BOOK_RESULT") return;

      const data = event.data.book || {};
      const isbn = normalizeISBNForNcl(data.isbn || $("field-isbn").value);
      if (isbn) $("field-isbn").value = isbn;
      if (data.title) $("field-title").value = data.title;
      if (data.author) $("field-author").value = data.author;
      if (data.translator) $("field-translator").value = data.translator;
      if (data.publisher) $("field-publisher").value = data.publisher;
      showScanStatus(`已從國家圖書館帶回書目資料：${data.title || "書名未取得"}。請確認後按「儲存」。`);
    });

    nclSearchBtn.addEventListener("click", () => {
      openNclSearch($("field-isbn").value);
    });

    function showScanStatus(msg, ncLinkIsbn) {
      scanStatus.hidden = false;
      if (ncLinkIsbn) {
        const isbn = normalizeISBNForNcl(ncLinkIsbn);
        scanStatus.innerHTML = `${escapeHtml(msg)}<br><a href="${NCL_SIMPLE_SEARCH_URL}" target="_blank" rel="noopener">到國家圖書館查詢「${escapeHtml(isbn)}」→</a>`;
      } else {
        scanStatus.textContent = msg;
      }
    }

    async function tryGoogleBooks(isbn) {
      try {
        const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`);
        const data = await res.json();
        const info = data.items && data.items[0] && data.items[0].volumeInfo;
        if (!info) return null;
        return {
          title: info.title || "",
          author: (info.authors || []).join("、"),
          publisher: info.publisher || "",
          cover: info.imageLinks && info.imageLinks.thumbnail ? info.imageLinks.thumbnail.replace("http://", "https://") : "",
          source: "Google Books",
        };
      } catch (err) { return null; }
    }

    async function tryOpenLibrary(isbn) {
      try {
        const res = await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`);
        const data = await res.json();
        const info = data[`ISBN:${isbn}`];
        if (!info) return null;
        return {
          title: info.title || "",
          author: (info.authors || []).map((a) => a.name).join("、"),
          publisher: (info.publishers || []).map((p) => p.name).join("、"),
          cover: info.cover ? (info.cover.medium || info.cover.large || info.cover.small || "") : "",
          source: "Open Library",
        };
      } catch (err) { return null; }
    }

    async function lookupISBN(isbn) {
      isbn = normalizeIsbn(isbn);
      if (!isbn) {
        showScanStatus("ISBN 格式不正確，請重新掃描或輸入。");
        return;
      }
      showScanStatus(`查詢 ISBN ${isbn} 中...`);
      $("field-isbn").value = isbn;
      const result = (await tryGoogleBooks(isbn)) || (await tryOpenLibrary(isbn));
      if (!result) {
        showScanStatus("公開書目資料庫查無這本書。你可以按「國圖查詢」，查到後直接帶回書名與作者。", isbn);
        return;
      }
      $("field-title").value = result.title || "";
      $("field-author").value = result.author || "";
      $("field-publisher").value = result.publisher || "";
      if (!pendingCoverFile && result.cover) {
        currentCoverUrl = result.cover;
        updateCoverPreview();
      }
      showScanStatus(`已從 ${result.source} 自動帶入書籍資料，請確認後儲存。`);
    }

    function normalizeIsbn(value) {
      const digits = String(value || "").replace(/\D/g, "");
      if (digits.length === 10 || digits.length === 13) return digits;
      return "";
    }

    // ================= Save / Delete =================
    // ================= Save / Delete =================
    bookForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!currentUser) {
        alert("目前尚未登入，無法儲存。請先登入 Google 帳號。");
        return;
      }
      const title = $("field-title").value.trim();
      if (!title) {
        alert("請先輸入書名。");
        $("field-title").focus();
        return;
      }
      const submitBtn = bookForm.querySelector('button[type="submit"]');
      const originalText = submitBtn.textContent;
      submitBtn.disabled = true;
      submitBtn.textContent = "儲存中…";
      try {
        const id = editingId || doc(collection(db, "books")).id;
        let coverUrl = currentCoverUrl;
        if (pendingCoverFile) coverUrl = await compressImageToDataUrl(pendingCoverFile);
        const tags = $("field-tags").value.split(",").map((t) => t.trim()).filter(Boolean);
        const data = {
          uid: currentUser.uid,
          title,
          author: $("field-author").value.trim(),
          translator: $("field-translator").value.trim(),
          publisher: $("field-publisher").value.trim(),
          isbn: $("field-isbn").value.trim(),
          purchaseDate: $("field-purchase-date").value || "",
          price: $("field-price").value ? Number($("field-price").value) : null,
          condition: $("field-condition").value || "new",
          status: $("field-status").value || "unread",
          category: $("field-category").value.trim() || "未分類",
          location: $("field-location").value.trim(),
          tags,
          rating: Number(currentRating) || 0,
          notes: Array.isArray(currentNotes) ? currentNotes : [],
          coverUrl: coverUrl || "",
          updatedAt: serverTimestamp(),
        };
        if (!editingId) data.createdAt = serverTimestamp();
        await setDoc(doc(db, "books", id), data, { merge: true });
        closeModal();
      } catch (err) {
        console.error("Firestore 儲存錯誤：", err);
        let message = "儲存失敗。";
        if (err?.code === "permission-denied") {
          message = "Firestore 拒絕寫入（permission-denied）。\n請到 Firebase Console → Firestore Database → Rules，確認 books 集合允許目前登入使用者建立/修改自己的資料。";
        } else if (err?.code === "unauthenticated") {
          message = "登入狀態已失效，請重新登入後再儲存。";
        } else if (err?.code === "failed-precondition") {
          message = "Firestore 尚未完成設定或目前資料庫狀態不允許寫入，請檢查 Firebase Console。";
        } else {
          message += "\n錯誤：" + (err?.message || err);
        }
        alert(message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
      }
    });

    deleteBookBtn.addEventListener("click", async () => {
      if (!editingId) return;
      if (!confirm("確定要刪除這本書嗎？此動作無法復原。")) return;
      await deleteDoc(doc(db, "books", editingId));
      closeModal();
    });
  </script>
</body>
